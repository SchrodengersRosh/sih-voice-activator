[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sih-voice-activator"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["websockets>=13,<16", "vosk>=0.3.45"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "sounddevice>=0.4.6", "numpy>=1.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
